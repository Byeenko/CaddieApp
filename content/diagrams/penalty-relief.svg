<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 340" width="320" height="340" font-family="-apple-system, Segoe UI, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect class="dg-bg" width="320" height="340" rx="14" fill="#ffffff"/>
<rect class="fill-fairway" fill="#b9d8b5" x="0" y="0" width="320" height="340" rx="14"/>
<path class="fill-water" fill="#a9cbe6" d="M180 120 Q260 100 300 150 Q310 230 240 240 Q180 230 180 120 Z"/>
<path class="line-bad" stroke="#c0583f" fill="none" d="M180 120 Q260 100 300 150 Q310 230 240 240 Q180 230 180 120 Z" stroke-width="2"/>
<line class="line-flag" stroke="#2b302c" fill="none" x1="250" y1="74" x2="250" y2="48" stroke-width="1.6"/>
<path class="fill-accent" fill="#1e6b47" d="M250 48 L262 52 L250 56 Z"/>
<ellipse class="fill-hole" fill="#1a1d1b" cx="250" cy="74" rx="3.5" ry="1.5" transform="rotate(0 250 74)"/>
<text class="label" x="264" y="60" text-anchor="start" fill="#191c1a" font-size="11" font-weight="600">Hole</text>
<circle class="fig-ball" cx="60" cy="300" r="4" fill="#ffffff" stroke="#5f665f" stroke-width="1"/>
<text class="label-muted" x="72" y="304" text-anchor="start" fill="#636a65" font-size="10">last shot played from here</text>
<path class="line-guide" stroke="#9aa09b" fill="none" d="M60 300 Q150 160 232 176" stroke-width="1.6"/>
<circle class="fill-bad" fill="#c0583f" cx="186" cy="160" r="4.5"/>
<text class="label-bad" x="176" y="152" text-anchor="start" fill="#c0583f" font-size="11" font-weight="600">X</text>
<text class="label-muted" x="16" y="120" text-anchor="start" fill="#636a65" font-size="10">X = where the ball last</text>
<text class="label-muted" x="16" y="132" text-anchor="start" fill="#636a65" font-size="10">crossed the edge</text>
<circle class="line-good" stroke="#1e6b47" fill="none" cx="186" cy="160" r="34"/>
<text class="label-accent" x="16" y="168" text-anchor="start" fill="#1e6b47" font-size="11" font-weight="600">① Lateral: drop within</text>
<text class="label-accent" x="16" y="181" text-anchor="start" fill="#1e6b47" font-size="11" font-weight="600">2 club-lengths of X,</text>
<text class="label-accent" x="16" y="194" text-anchor="start" fill="#1e6b47" font-size="11" font-weight="600">not nearer the hole</text>
<line class="line-good" stroke="#1e6b47" fill="none" x1="250" y1="74" x2="120" y2="268" stroke-dasharray="5 4"/>
<text class="label-accent" x="16" y="236" text-anchor="start" fill="#1e6b47" font-size="11" font-weight="600">② Back on the line</text>
<text class="label-accent" x="16" y="249" text-anchor="start" fill="#1e6b47" font-size="11" font-weight="600">hole → X, any distance</text>
<text class="label-accent" x="16" y="330" text-anchor="start" fill="#1e6b47" font-size="11" font-weight="600">③ Stroke and distance: replay from the last spot</text>
<text class="label" x="16" y="24" text-anchor="start" fill="#191c1a" font-size="11" font-weight="600">Red penalty area: options, each +1 stroke</text>
<text class="label-muted" x="16" y="40" text-anchor="start" fill="#636a65" font-size="10">Yellow: only ② and ③</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
