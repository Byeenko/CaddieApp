<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Caddie</title>

  <!-- Installable iPhone web app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Caddie">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#F6F5F1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E110F" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <main id="view" aria-live="polite">
      <div class="splash">
        <img src="icons/icon-180.png" alt="" width="72" height="72">
      </div>
    </main>
    <nav id="tabbar" class="tabbar" aria-label="Main"></nav>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
